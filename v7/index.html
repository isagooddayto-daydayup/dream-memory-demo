function fxDyno(S){
 // per-splat shader: colour grade + static dream fog + "memory dissolve" (scatter → glowing particles → swirl)
 S.uT=dyno.dynoFloat(0);S.uTime=dyno.dynoFloat(0);S.uC=dyno.dynoVec3(new THREE.Vector3(S.spawn[0],1,S.spawn[1]));
 S.uGlow=dyno.dynoVec3(new THREE.Vector3(...S.glow));S.uCam=dyno.dynoVec3(new THREE.Vector3(0,-999,0));
 const F=new THREE.Vector3(S.spawn[0],0,S.spawn[1]);
 return dyno.dynoBlock({gsplat:dyno.Gsplat},{gsplat:dyno.Gsplat},({gsplat})=>{
  const d=new dyno.Dyno({
   inTypes:{gsplat:dyno.Gsplat,t:'float',time:'float',c:'vec3',glow:'vec3',cam:'vec3'},
   outTypes:{gsplat:dyno.Gsplat},
   globals:()=>[dyno.unindent(`
    vec4 dhash4(int n){float x=float(n);return fract(sin(vec4(x*0.1031,x*0.11369+1.7,x*0.13787+3.1,x*0.0973+5.3))*43758.5453);}
   `)],
   statements:({inputs:I,outputs:O})=>dyno.unindentLines(`
    ${O.gsplat}=${I.gsplat};
    vec3 p=${I.gsplat}.center; vec3 col=${I.gsplat}.rgba.rgb; float al=${I.gsplat}.rgba.a;
    // grade: soft desaturate + warm/cool memory tint + lifted blacks
    float lum=dot(col,vec3(0.299,0.587,0.114));
    col=mix(vec3(lum),col,${S.sat.toFixed(3)})*vec3(${S.tint.map(v=>v.toFixed(3)).join(',')});
    col=col*0.92+0.06;
    // static dream haze: by distance from the memory's centre, and height (sky dome)
    float fd=length(p.xz-vec2(${F.x.toFixed(2)},${F.z.toFixed(2)}));
    float fogA=smoothstep(${S.fogR[0].toFixed(1)},${S.fogR[1].toFixed(1)},fd)*0.78+smoothstep(14.0,60.0,p.y)*0.35;
    col=mix(col,vec3(${S.fog.map(v=>v.toFixed(3)).join(',')}),clamp(fogA,0.0,0.85));
    float T=${I.t};
    if(T>0.0){
      vec4 h=dhash4(${I.gsplat}.index);
      vec3 cc=${I.c};
      vec3 d=p-cc; float r=length(d.xz);
      float delay=clamp(r/60.0,0.0,1.0)*0.55+h.x*0.18;
      float q=clamp((T*1.75-delay)/1.0,0.0,1.0); q=q*q*(3.0-2.0*q);
      float ang=atan(d.z,d.x)+q*q*(2.2+3.5*h.y)+${I.time}*0.35*q;
      float rr=mix(r,1.6+r*0.28+5.0*h.y,q*0.85);
      float lift=q*q*(2.0+11.0*h.x);
      vec3 np=vec3(cc.x+cos(ang)*rr, p.y+lift, cc.z+sin(ang)*rr);
      np+=vec3(sin(${I.time}*1.9+h.z*6.283),cos(${I.time}*1.5+h.w*6.283),sin(${I.time}*1.2+h.y*6.283))*0.35*q;
      vec3 fp=mix(p,np,q); ${O.gsplat}.center=fp;
      float camFade=smoothstep(1.2,4.5,length(fp-${I.cam}));
      bool spark=h.w<0.13;
      float ps=0.018+0.03*h.z;
      if(spark)${O.gsplat}.scales=mix(min(${I.gsplat}.scales,vec3(0.12)),vec3(ps),smoothstep(0.0,0.15,q));
      vec3 g=${I.glow}*(1.05+0.6*h.y);
      if(spark){ col=mix(col,g,smoothstep(0.18,0.5,q)); al=mix(al,0.85,smoothstep(0.2,0.5,q))*(1.0-smoothstep(0.85,1.0,q)); al*=mix(1.0,camFade,smoothstep(0.05,0.3,q)); }
      else { al*=1.0-smoothstep(0.0,0.25,q);
             ${O.gsplat}.scales=${I.gsplat}.scales*(1.0-0.7*smoothstep(0.0,0.25,q)); }
    }
    ${O.gsplat}.rgba=vec4(col,al);
   `)});
  return {gsplat:d.apply({gsplat,t:S.uT,time:S.uTime,c:S.uC,glow:S.uGlow,cam:S.uCam}).gsplat};
 });
}

function groundL(S,x,z){const g=S.g;if(!g)return 0;let fx=(x-g.x0)/g.cs,fz=(z-g.z0)/g.cs;fx=Math.max(0,Math.min(g.nx-1.001,fx));fz=Math.max(0,Math.min(g.nz-1.001,fz));
 const ix=Math.floor(fx),iz=Math.floor(fz),tx=fx-ix,tz=fz-iz,h=S.h,n=g.nx;
 const a=h[iz*n+ix],b=h[iz*n+ix+1],c=h[(iz+1)*n+ix],d=h[(iz+1)*n+ix+1];return (a*(1-tx)+b*tx)*(1-tz)+(c*(1-tx)+d*tx)*tz;}
const _gr=new THREE.Raycaster(),_gdn=new THREE.Vector3(0,-1,0),_go=new THREE.Vector3();
function groundW(key,x,z,yref){const S=SC[key];
 if(S.kind==='mesh'){if(!S.walk)return S.lastG||0;_go.set(x,(yref===undefined?S.off.y+60:yref+1.2),z);_gr.set(_go,_gdn);_gr.far=200;

async function loadMeshScene(S){
 const ld=new GLTFLoader();const root=new THREE.Group();root.position.copy(S.off);S.walk=[];
 if(S.meshPack==='classroom'){
  // warm nostalgia sky dome (procedural gradient via vertex colors on a simple sphere tint)

  const dome=new THREE.Mesh(new THREE.SphereGeometry(180,32,16),skyMat);dome.renderOrder=-5;root.add(dome);

  const sun=new THREE.DirectionalLight(0xffd39a,1.25);sun.position.set(12,22,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);root.add(sun);
  const ground=new THREE.Mesh(new THREE.CircleGeometry(48,72),new THREE.MeshStandardMaterial({color:0xcbb892,roughness:1,metalness:0}));
  ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;root.add(ground);
  // soft gold dust motes
  const N=180;const pos=new Float32Array(N*3);for(let i=0;i<N;i++){pos[i*3]=(Math.random()-0.5)*36;pos[i*3+1]=0.4+Math.random()*6;pos[i*3+2]=(Math.random()-0.5)*36;}
  const mote=new THREE.Points(new THREE.BufferGeometry().setAttribute('position',new THREE.BufferAttribute(pos,3)),new THREE.PointsMaterial({color:0xffe2a8,size:0.08,transparent:true,opacity:0.55,depthWrite:false}));root.add(mote);
  const [bldg,cls,slide]=await Promise.all([
   ld.loadAsync('scenes/classroom/school-building.glb'),
   ld.loadAsync('scenes/classroom/classroom.glb'),
   ld.loadAsync('scenes/classroom/playground-slide.glb')
  ]);
  bldg.scene.position.set(0,0,-14);bldg.scene.rotation.y=0;
  cls.scene.position.set(10,0,0);cls.scene.rotation.y=-Math.PI*0.5;
  slide.scene.position.set(-9,0,7);slide.scene.scale.setScalar(1.15);
  for(const g of [bldg,cls,slide]){g.scene.traverse(o=>{if(o.isMesh){o.frustumCulled=false;o.castShadow=true;o.receiveShadow=true;}});root.add(g.scene);}
  scene.add(root);root.updateMatrixWorld(true);
  // walkable: ground + building/classroom meshes
  S.walk=[ground];
  for(const g of [bldg,cls,slide]) g.scene.traverse(o=>{if(o.isMesh)S.walk.push(o);});
  S.mesh=root;S.loaded=true;return S;
 }
 // default: ARES pack
 const sky=await new THREE.TextureLoader().loadAsync('scenes/ares/mars_sky.jpg');sky.colorSpace=THREE.SRGBColorSpace;
 const dome=new THREE.Mesh(new THREE.SphereGeometry(380,48,24),new THREE.MeshBasicMaterial({map:sky,side:THREE.BackSide,depthWrite:false,fog:false}));dome.renderOrder=-5;root.add(dome);
 const [w,dc]=await Promise.all([ld.loadAsync('scenes/ares/mars_walk.glb'),ld.loadAsync('scenes/ares/mars_deco.glb')]);
 for(const g of [w,dc]){g.scene.traverse(o=>{if(o.isMesh){o.frustumCulled=false;}});root.add(g.scene);}
 scene.add(root);root.updateMatrixWorld(true);w.scene.traverse(o=>{if(o.isMesh)S.walk.push(o);});
 S.mesh=root;S.loaded=true;return S;}
async function loadScene(key,prog){
 const S=SC[key];if(S.kind==='mesh')return loadMeshScene(S);await loadHM(S);
 const m=new SplatMesh({url:S.url,lod:S.lod!==false,onProgress:e=>{if(prog&&e.total)prog(e.loaded/e.total);}});
 m.position.copy(S.off);
 m.objectModifier=fxDyno(S);

 // small non-LoD copy (voxel-merged) used only for the view through the portal from the other memory

 S.loaded=true;return S;
}

const AV={ready:false};
async function loadAvatar(base){
 const meta=await (await fetch(base+'.json')).json();
 const bin=new Float32Array(await (await fetch(base+'.bin')).arrayBuffer());
 const loader=new GLTFLoader();loader.register(p=>new VRMLoaderPlugin(p,{autoUpdateHumanBones:true}));
 const gltf=await loader.loadAsync(base+'.vrm');const vrm=gltf.userData.vrm;

 const s=meta.modelScale;const bb=new THREE.Box3().setFromObject(vrm.scene);const sz=new THREE.Vector3();bb.getSize(sz);
 vrm.scene.position.y+=-sz.y*0.5*s;vrm.scene.scale.setScalar(s);VRMUtils.rotateVRM0(vrm);vrm.scene.updateMatrix();
 let smi=1;if(vrm.scene.children.length>4)smi=2;
 const sm=vrm.scene.children[smi];
 // GVRM rest pose (A-pose) via boneOperations
 for(const op of meta.boneOperations){const raw=vrm.humanoid.getRawBoneNode(op.boneName),nb=vrm.humanoid.getNormalizedBoneNode(op.boneName);if(!raw)continue;
  if(op.position){raw.position.x+=op.position.x;raw.position.y+=op.position.y;raw.position.z+=op.position.z;}
  if(op.rotation){nb.rotation.set(op.rotation.x*Math.PI/180,op.rotation.y*Math.PI/180,op.rotation.z*Math.PI/180);}}
 vrm.humanoid.update();vrm.scene.updateMatrixWorld(true);sm.skeleton.update();
 if(smi===2){const head=vrm.humanoid.getRawBoneNode('head');const ht=new THREE.Bone();ht.name='J_Bip_C_HeadTop_End';ht.position.set(0,0.2,-0.05);head.add(ht);ht.updateMatrixWorld(true);
  sm.skeleton.bones.push(ht);sm.bind(new THREE.Skeleton(sm.skeleton.bones),sm.matrixWorld);}
 vrm.scene.updateMatrixWorld(true);
 const bones=sm.skeleton.bones,nB=bones.length,bInv=sm.skeleton.boneInverses;
 const K0inv=[],tmp=new THREE.Matrix4();

 const n=meta.n,st=meta.stride;
 const sceneQ=vrm.scene.getWorldQuaternion(new THREE.Quaternion());const gsQ=new THREE.Quaternion(...meta.gsQuaternion);

 const sceneM=vrm.scene.matrixWorld;const scan2local=sceneM.clone().invert().multiply(gsM);
 const packed=new PackedSplats({maxSplats:n});
 const c=new THREE.Vector3(),v=new THREE.Vector3(),acc=new THREE.Vector3(),scl=new THREE.Vector3(),q=new THREE.Quaternion(),col=new THREE.Color(),chk=new THREE.Vector3(),w2=new THREE.Vector3();
 const minYs=[];const skinIdx=new Uint8Array(n*4),skinW=new Float32Array(n*4);let err=0;
 for(let i=0;i<n;i++){const o=i*st,vi=bin[o+14]|0;
  v.fromBufferAttribute(pos,vi);acc.set(0,0,0);

 const joy=$('joy'),knob=$('knob');

// ---------------- update loop ----------------
const _f=new THREE.Vector3(),_r=new THREE.Vector3(),_mv=new THREE.Vector3(),_look=new THREE.Vector3(),_cam=new THREE.Vector3();
function update(dt){
 if(CS.on)return;
 P.t+=dt;const prev=P.pos.clone();
 const run=keys.ShiftLeft||keys.ShiftRight||TOUCH.jm>0.92;
 _f.set(-Math.sin(P.yaw),0,-Math.cos(P.yaw));_r.set(-_f.z,0,_f.x);
 _mv.set(0,0,0);if(keys.KeyW||keys.ArrowUp)_mv.add(_f);if(keys.KeyS||keys.ArrowDown)_mv.sub(_f);if(keys.KeyD||keys.ArrowRight)_mv.add(_r);if(keys.KeyA||keys.ArrowLeft)_mv.sub(_r);
 if(TOUCH.jm>0.08){_mv.addScaledVector(_f,-TOUCH.jy).addScaledVector(_r,TOUCH.jx);}
 const mv=_mv.lengthSq()>0;if(mv)_mv.normalize();
 if(keys.Space&&!P.fly){P.fly=true;try{V7.markFlight(V7SESS);}catch(_){}}
 const gy=groundW(cur,P.pos.x,P.pos.z,P.pos.y);
 let sp=(P.fly?(run?11:5.5):(run?4.6:1.9))*(TOUCH.jm>0.08?Math.min(1,TOUCH.jm*1.3):1);
 P.pos.addScaledVector(_mv,sp*dt);
 if(P.fly){let vy=0;if(keys.Space)vy+=3.2;if(keys.ControlLeft||keys.KeyQ)vy-=3.2;P.pos.y+=vy*dt;
  if(P.pos.y<gy+0.02){P.pos.y=gy;if(!keys.Space&&P.flyK>0.3&&vy<0)P.fly=false;}
  P.pos.y=Math.min(P.pos.y,gy+60);}
 else{P.pos.y+= (gy-P.pos.y)*Math.min(1,dt*12);}
 // pose
 const targetSpeed=mv?(run?2:1):0;P.speed+=(targetSpeed-P.speed)*Math.min(1,dt*6);
 P.flyK+=((P.fly?1:0)-P.flyK)*Math.min(1,dt*3);
 const aim=CAMS[P.cam]==='first'||CAMS[P.cam]==='shoulder';
 if(aim){P.heading=P.yaw;}else if(mv){const hd=Math.atan2(-_mv.x,-_mv.z);let d=hd-P.heading;d=Math.atan2(Math.sin(d),Math.cos(d));P.heading+=d*Math.min(1,dt*8);}
 player.position.copy(P.pos);player.rotation.set(0,P.heading,0);
 const tilt=P.flyK*Math.min(1,P.speed)*(run?1.25:0.95);
 body.position.set(0,P.flyK*0.25+Math.sin(P.t*1.6)*0.06*P.flyK,0);body.rotation.set(-tilt,0,0);
 if(AV.ready){if(!window.__nopose)poseAvatar(P.t,0,P.speed,P.flyK);avatarBones();}
 if(PL.model)posePlayer(dt);
 portalCross(prev,P.pos);
 // camera: third person
 const cm=CAMS[P.cam];const eye=(PL.h||1.65);
 if(PL.model)PL.model.visible=(cm!=='first');
 if(cm==='first'){_cam.set(P.pos.x,P.pos.y+eye*0.94+body.position.y,P.pos.z).addScaledVector(_f,0.12);
  _look.set(-Math.sin(P.yaw)*Math.cos(P.pitch),Math.sin(P.pitch),-Math.cos(P.yaw)*Math.cos(P.pitch)).add(_cam);
  camera.position.copy(_cam);camera.lookAt(_look);}
 else{const cd=cm==='far'?7.5:cm==='shoulder'?2.1:P.camD;const lh=cm==='shoulder'?eye*0.92:eye*0.78;
  _look.set(P.pos.x,P.pos.y+lh+P.flyK*0.2,P.pos.z);if(cm==='shoulder')_look.addScaledVector(_r,0.5);
  const pt=cm==='far'?Math.min(P.pitch,-0.3):P.pitch;
  _cam.set(Math.sin(P.yaw)*Math.cos(pt)*cd,-Math.sin(pt)*cd,Math.cos(P.yaw)*Math.cos(pt)*cd).add(_look);
  const cg=groundW(cur,_cam.x,_cam.z,_cam.y)+0.3;if(_cam.y<cg)_cam.y=cg;
  camera.position.copy(_cam);camera.lookAt(_look);}if(window.__camFn)window.__camFn(camera,P);
 // which scenes need to be visible
 for(const k of ORDER){const S=SC[k];if(!S.mesh)continue;let vis=(k===cur),pv=false;
  if(TR.on)vis=(k===(TR.phase===0?TR.from:TR.to));
  else if(pair&&!vis&&(k==='A'||k==='B')&&(cur==='A'||cur==='B')){const mine=(k==='B'?pair.entryPortal:pair.exitPortal);pv=mine.position.distanceTo(P.pos)<35;}
  if(Q.get('pv')==='0'){S.mesh.visible=vis||pv;}else{S.mesh.visible=vis;if(S.prev)S.prev.visible=pv;}if(S.uTime)S.uTime.value=P.t;}
 rings.forEach((r,i)=>{r.children[1].material.opacity=0.22+0.12*Math.sin(P.t*3+i);r.rotation.z=P.t*0.4;});
 if(TR.spark.visible){TR.spark.position.copy(P.pos);TR.spark.rotation.y=P.t*0.6;TR.spark.material.opacity=0.5+0.4*Math.sin(P.t*5);}
 stepDissolve(dt);
 npcUpdate(dt);
 mgUpdate();
 v7NearUpdate();
}
let last=performance.now(),frames=0,fpsT=0,fps=0;

 if(V7_NEAR){MGX.near=null;MGM.setPrompt(null);return;} if(best!==MGX.near){MGX.near=best;MGM.setPrompt(best?(TOUCH.on?'👆 点这里进入「'+best.userData.name+'」':'按 E 进入「'+best.userData.name+'」'):null,best?()=>mgEnter(best.userData.id):null);}}
addEventListener('keydown',e=>{if(MGM.MG.active||CS.on||V7_CHAT)return;
 if(e.code==='KeyE'){if(V7_NEAR){v7OpenChat();return;}if(MGX.near)mgEnter(MGX.near.userData.id);}

});

window.__G={MGM,MGX,mgEnter,mgUpdate,PL,ROSTER,setChar,goScene,CAMS,toggleMenu,ORDER,NPCS,CS,playCutscene,enterDream,THREE,P,SC,AV,TR,keys,update,startDissolve,place,makePortal,removePortal,camera,player,body,portals,get cur(){return cur;},set cur(v){cur=v;},groundW,poseAvatar,avatarBones,showTitle,V7,get V7MEM(){return V7MEM;},get V7SESS(){return V7SESS;},v7OpenChat,v7CloseChat,v7EndSession,get V7_NEAR(){return V7_NEAR;}};
